name: enterprise-knowledge-rag

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rag
      POSTGRES_PASSWORD: rag
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
      args:
        PYTHON_IMAGE: ${BACKEND_PYTHON_IMAGE:-docker.m.daocloud.io/library/python:3.11-slim}
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://rag:rag@postgres:5432/rag
      CORS_ORIGINS: http://localhost:5174,http://127.0.0.1:5174,http://localhost:5173,http://127.0.0.1:5173
      UPLOAD_DIR: data/uploads
      EVAL_CASES_PATH: /app/eval_cases.json
    ports:
      - "8001:8000"
    volumes:
      - ./data:/app/data
      - ./eval_cases.json:/app/eval_cases.json:ro
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NODE_IMAGE: ${FRONTEND_NODE_IMAGE:-docker.m.daocloud.io/library/node:20-alpine}
        NGINX_IMAGE: ${FRONTEND_NGINX_IMAGE:-docker.m.daocloud.io/library/nginx:1.27-alpine}
    ports:
      - "5174:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
